name: Generate GitBlog README

on:
  workflow_dispatch:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  push:
    branches:
      - master
    paths:
      - main.py
      - .github/workflows/generate_readme.yml

permissions:
  contents: write
  issues: read

concurrency:
  group: generate-readme
  cancel-in-progress: false

jobs:
  sync:
    name: Generate README
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.repository_owner_id == github.event.issue.user.id
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate new md
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_NAME: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GITHUB_NAME: ${{ github.repository_owner }}
        run: python main.py "$GH_TOKEN" "$REPO_NAME" --issue_number "$ISSUE_NUMBER"

      - name: Push README
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md feed.xml BACKUP/
          if git diff --cached --quiet; then
            echo "No blog changes to commit"
            exit 0
          fi
          git commit -m 'update blog index and backups'
          git push origin HEAD:master
